<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Icebreaker Bingo</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Page-specific: vertically center the landing card, spacing within it */
  .page { justify-content: center; padding-left: 20px; padding-right: 20px; }

  .landing-card { text-align: center; }
  .landing-card .emoji-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.9rem; font-weight: 800;
    color: var(--orange); letter-spacing: -0.02em; line-height: 1.1;
    margin-bottom: 14px;
  }
  .landing-card p.blurb {
    font-size: 0.9rem; color: var(--muted); line-height: 1.5;
    margin-bottom: 22px;
  }
  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-google .btn-google-label { display: inline-flex; align-items: center; gap: 10px; }
</style>
</head>
<body>

<div class="page">
  <div class="card landing-card">
    <div class="emoji-title">🎉 Icebreaker Bingo</div>
    <p class="blurb">
      A mobile-friendly bingo icebreaker for mingling in person. Hosts create their own set of 24 phrases
      and start a session; players join instantly via a shared link or QR code — no account needed — and
      mingle to find matches on their board.
    </p>
    <button class="btn-google" id="googleBtn" type="button">
      <span class="btn-google-label" id="googleBtnLabel">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        <span id="googleBtnText">Continue with Google</span>
      </span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const toastEl = document.getElementById('toast');
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  // Already logged in? Skip straight to the dashboard.
  (async () => {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        location.replace('dashboard.html');
      }
    } catch (err) {
      // Ignore — just show the landing page as normal.
    }
  })();

  const googleBtn = document.getElementById('googleBtn');
  const googleBtnText = document.getElementById('googleBtnText');

  googleBtn.addEventListener('click', async () => {
    googleBtn.disabled = true;
    googleBtnText.textContent = 'Redirecting…';
    try {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: new URL('auth.html', window.location.href).toString() }
      });
      if (error) throw error;
    } catch (err) {
      showToast('Could not start sign-in. Please try again.');
      googleBtn.disabled = false;
      googleBtnText.textContent = 'Continue with Google';
    }
  });
</script>
</body>
</html>
